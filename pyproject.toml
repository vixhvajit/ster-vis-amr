[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ster-vis-amr"
dynamic = ["version"]
description = "Controller for the Ster-Vis test AMR: Ster-Vis stereo depth, obstacle avoidance, L298N skid-steer motors, and a Gazebo model to try it on."
readme = "README.md"
authors = [{ name = "Vishvajit S" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.5,<3",
    # Ster-Vis's laser scan and camera model; the depth itself comes from the
    # ster-vis service over HTTP (or from its pipeline, in the sim).
    "ster-vis @ git+https://github.com/vixhvajit/Ster-Vis@v2.1.0",
]

[project.optional-dependencies]
# On Raspberry Pi OS use the apt packages instead (python3-gpiozero, python3-lgpio);
# deploy/pi/install.sh does.
pi = ["gpiozero>=2.0", "lgpio"]
dev = ["pytest>=8.0"]

[project.scripts]
amr = "amr.cli:main"

[tool.setuptools.dynamic]
version = { attr = "amr.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
